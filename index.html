<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Practics</title>
    <link rel="stylesheet" href="style.CSS">
</head>
<body>
    <!--Element Selector-->
    <h1>Welcome to my Webside</h1>
    <p>This is an Element Selector.</p>
    <!--Class Selector-->
    <h2 class="heading">CSS Class Example</h1>
    <p class="text">This is a Class Selector.</p>
    <!--ID Selector-->
    <h2 id="title">CSS ID Example</h2>
    <!--Background Image Selector-->
    <div class="box">
        <h2>Background Picture</h2>
        <p>Beautiful Background Image</p>

    </div>
        <!--Button Selector-->
        <button>Click Me</button>
    
</body>
</html>
